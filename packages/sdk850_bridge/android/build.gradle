group = "com.goper.sdk850_bridge"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}


// URL do repositório Maven com o .aar do fabricante (plano, seção 5.4).
// Vem da propriedade sdk850MavenUrl (relativa à raiz do build Android do app);
// sem ela (build isolado do plugin), usa maven-repo/ na raiz do monorepo.
def sdk850MavenUri = {
    def prop = project.findProperty("sdk850MavenUrl")
    def dir = prop ? rootProject.file(prop) : file("../../../maven-repo")
    return dir.toURI()
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = sdk850MavenUri()
            content { includeGroup("com.sunway") }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.goper.sdk850_bridge"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation("com.sunway:sdk850:1.0.0")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
